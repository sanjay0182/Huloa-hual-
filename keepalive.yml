# Place at: .github/workflows/keepalive.yml  (PUBLIC repo)
# Needs: Settings -> Secrets and variables -> Actions -> Variables -> APP_URL
name: keepalive

on:
  schedule:
    - cron: "17 * * * *"   # safety net: only starts a new chain if no run is active
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Minutes to wait before visiting"
        default: "0"

permissions:
  contents: read
  actions: write           # needed so a run can start the next one

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip if another run is active (cron trigger only)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow keepalive.yml --json status,databaseId \
            --jq "[.[] | select(.status==\"in_progress\" or .status==\"queued\" or .status==\"waiting\") | select(.databaseId != $GITHUB_RUN_ID)] | length")
          echo "other=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.other == '' || steps.guard.outputs.other == '0'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.other == '' || steps.guard.outputs.other == '0'
        with:
          python-version: "3.12"

      - name: Install browser (done early, before the wait)
        if: steps.guard.outputs.other == '' || steps.guard.outputs.other == '0'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wait, then visit like a person for ~45 min
        if: steps.guard.outputs.other == '' || steps.guard.outputs.other == '0'
        env:
          APP_URL: ${{ vars.APP_URL }}
          WAIT_MINUTES: ${{ github.event.inputs.wait_minutes || '0' }}
        run: python visit.py

      - name: Start next run (it waits 15-65 min, so visits are 60-110 min apart)
        if: always() && (steps.guard.outputs.other == '' || steps.guard.outputs.other == '0')
        run: gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" -f wait_minutes=$((15 + RANDOM % 51))
