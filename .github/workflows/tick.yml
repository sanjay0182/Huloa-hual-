# Place at: .github/workflows/tick.yml
# Tiny scheduler: every 30 min it (1) deletes old runs, (2) starts a visit run
# only if no visit run is active AND the last one ended at least 60 min ago.
name: tick

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep only the newest 10 finished runs of each workflow
        run: |
          for wf in visit.yml tick.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --status completed --limit 100 \
              --json databaseId --jq '.[10:] | .[].databaseId' | while read -r id; do
              [ -n "$id" ] && gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true
            done
          done

      - name: Start a visit run if idle for at least 1 hour
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow visit.yml --json status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          if [ "$active" != "0" ]; then echo "visit run is active, skip"; exit 0; fi

          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow visit.yml --status completed --limit 1 \
            --json updatedAt --jq '.[0].updatedAt // empty')
          if [ -n "$last" ]; then
            age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            if [ "$age" -lt 3600 ]; then echo "last run ended $((age/60)) min ago, wait"; exit 0; fi
          fi

          gh workflow run visit.yml --repo "$GITHUB_REPOSITORY"
          echo "visit run started"
