# Place at: .github/workflows/visit.yml
# One visit run: random 0-15 min start delay, then 30-59 min of visits, then it ends.
name: visit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit like a person (random timing)
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: python visit.py
