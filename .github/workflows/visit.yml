# Place at: .github/workflows/visit.yml
# One visit run: short random start delay, then 30-59 min of visits, then it
# starts the next run right away so the app never sleeps in between.
name: visit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: visit-run
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit like a person (random timing)
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: python visit.py

      - name: Start the next run right away (only if this one succeeded)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run visit.yml --repo "$GITHUB_REPOSITORY"
