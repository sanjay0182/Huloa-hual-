# Place at: .github/workflows/monthly-touch.yml
# Makes one small commit per month so GitHub does not pause scheduled workflows.
name: monthly-touch

on:
  schedule:
    - cron: "30 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"last touch: %Y-%m-%dT%H:%M:%SZ" > last-touch.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-touch.txt
          git commit -m "monthly touch" || exit 0
          git push
